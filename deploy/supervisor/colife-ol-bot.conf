[program:colife-ol-bot]
command=/usr/local/bin/node --env-file=/var/www/colife_db/vibecode-openlines-bot/.env server.js
directory=/var/www/colife_db/vibecode-openlines-bot
autostart=true
autorestart=true
startsecs=3
stopasgroup=true
killasgroup=true
user=www-data
numprocs=1
redirect_stderr=true
stdout_logfile=/var/www/colife_db/storage/logs/colife-ol-bot.log
stdout_logfile_maxbytes=20MB
stdout_logfile_backups=5
stopwaitsecs=30
