[program:horizon]
process_name=%(program_name)s
command=php /var/www/colife_db/artisan horizon
directory=/var/www/colife_db
environment=CACHE_STORE="file",DB_CONNECTION="mysql",QUEUE_CONNECTION="redis",APP_ENV="production",REDIS_CLIENT="phpredis"
autostart=true
autorestart=true
startsecs=3
stopasgroup=true
killasgroup=true
user=root
numprocs=1
redirect_stderr=true
stdout_logfile=/var/www/colife_db/storage/logs/horizon.log
stdout_logfile_maxbytes=20MB
stdout_logfile_backups=5
stopwaitsecs=3600
