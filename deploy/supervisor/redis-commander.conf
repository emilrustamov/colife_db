[program:redis-commander]
command=/usr/local/bin/redis-commander --redis-host 127.0.0.1 --redis-port 6379 --redis-db 0 --address 127.0.0.1 --port 8082 --url-prefix /redis-ui --http-auth-username redis --http-auth-password REPLACE_ME --folding-char :
directory=/tmp
autostart=true
autorestart=true
startsecs=3
stopasgroup=true
killasgroup=true
user=root
numprocs=1
redirect_stderr=true
stdout_logfile=/var/log/redis-commander.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=3
stopwaitsecs=10
